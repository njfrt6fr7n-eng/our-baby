<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아랑이의 성별 공개 ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      /* 첫 화면 기본 배경: 차분하고 따뜻한 웜그레이/크림 그라데이션 */
      background: linear-gradient(135deg, #f7f5f0 0%, #e8e4dc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: background 0.8s ease;
    }
    /* 결과 공개 후 배경 전환 클래스 */
    body.reveal-bg {
      background: linear-gradient(135deg, #ffeef8 0%, #ffe3f1 100%);
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 36px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.8s ease;
    }
    .card.reveal-shadow {
      box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
    }

    h1 {
      font-size: 22px;
      color: #333333;
      margin-bottom: 12px;
      line-height: 1.4;
      word-break: keep-all;
    }
    p.sub {
      font-size: 14px;
      color: #666666;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* 첫 화면 버튼: 피치/골드 빛 세련된 톤 */
    .btn {
      background: linear-gradient(135deg, #f3a683 0%, #f7d794 100%);
      color: #333;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(243, 166, 131, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .hidden {
      display: none !important;
    }

    /* 결과 화면 스타일 */
    .gender {
      font-size: 38px;
      font-weight: 900;
      color: #ff4785;
      margin: 16px 0 8px;
      letter-spacing: 1px;
    }
    .message {
      font-size: 18px;
      font-weight: 700;
      color: #4a4a4a;
      margin-bottom: 20px;
      line-height: 1.4;
      word-break: keep-all;
    }
    .photo-frame {
      width: 100%;
      border-radius: 16px;
      background-color: #ffffff;
      overflow: hidden;
      margin-top: 15px;
      border: 2px solid #ffe3f1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .photo-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .confetti {
      position: absolute;
      width: 9px;
      height: 15px;
      background: #ff7eb9;
      top: -15px;
      opacity: 0.85;
      border-radius: 2px;
      animation: fall 3s linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(550px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. 안내/버튼 화면 (중립적인 차분한 톤) -->
    <section id="intro">
      <h1>아랑이와 만나기까지<br>두근두근… 💛</h1>
      <p class="sub">아랑이의 성별이 궁금하다면<br>아래 버튼을 눌러주세요!</p>
      <button class="btn" onclick="reveal()">두근두근 공개하기 ✨</button>
    </section>

    <!-- 2. 결과 공개 화면 (핑크 톤 전환) -->

  <script>
    function reveal() {
      // 1. 화면 전환
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');

      // 2. 전체 배경 및 카드에 핑크 톤 적용
      document.body.classList.add('reveal-bg');
      document.querySelector('.card').classList.add('reveal-shadow');

      // 3. 꽃가루 효과 실행
      createConfetti();
    }

    function createConfetti() {
      const colors = ['#ff7eb9', '#ff65a3', '#ffcd38', '#ffffff', '#ffb6c1'];
      const card = document.querySelector('.card');
      for (let i = 0; i < 45; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.animationDelay = Math.random() * 2.5 + 's';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        card.appendChild(confetti);
      }
    }
  </script>
